name: ci

on:
  push:
    branches: [gramene]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 7 and jsdom 27 need Node ^20.19 || >=22.12.
        node: ['20.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Fails with E404 until gramene-anatomogram 3.0.0 is published and package-lock.json records it
      - run: npm ci
      # vitest + jsdom; any React warning (console.error/warn) fails a test
      - run: npm test
      # vite build, then scripts/copy-dts.mjs and scripts/check-dist.mjs
      - run: npm run build
      # publint, then attw on a packed tarball
      - run: npm run lint:pkg
      - name: React, Highcharts and the anatomogram SVGs are not bundled
        run: |
          for text in 'react.production' 'Highcharts JS v6' 'gxa/licence.html'; do
            count="$(cat dist/*.js dist/*.cjs | grep -c "$text" || true)"
            test "$count" = "0" || { echo "dist contains '$text' ($count lines)"; exit 1; }
          done
